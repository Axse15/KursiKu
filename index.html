<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Pasang tema sebelum halaman digambar supaya tidak berkedip putih/hitam saat dibuka.
      try {
        var t = localStorage.getItem("kursiku_theme");
        if (t !== "light" && t !== "dark")
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>KursiKu - Pesan Tiket Bioskop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-page text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
